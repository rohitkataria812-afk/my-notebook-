<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>My Notebook</title>
<meta name="theme-color" content="#6C5CE7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ====== LOADING SPLASH ====== -->
<div id="splash" class="splash">
  <div class="splash-logo"><i class="fa-solid fa-book-bookmark"></i></div>
  <div class="splash-title">My Notebook</div>
  <div class="spinner"></div>
</div>

<!-- ====== TOAST CONTAINER ====== -->
<div id="toastContainer" class="toast-container"></div>

<!-- ====== AUTH SCREEN ====== -->
<div id="authScreen" class="screen auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo"><i class="fa-solid fa-book-bookmark"></i></div>
    <h1>My Notebook</h1>
    <p class="auth-sub">Your thoughts, beautifully organized.</p>

    <div id="authError" class="auth-error hidden"></div>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
      </div>
      <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <span>Log In</span>
      </button>
      <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <div class="field">
        <i class="fa-regular fa-user"></i>
        <input type="text" id="signupName" placeholder="Full name" required autocomplete="name">
      </div>
      <div class="field">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
      </div>
      <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="signupBtn">
        <span>Create Account</span>
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>
    <button id="guestBtn" class="btn-secondary"><i class="fa-solid fa-user-secret"></i> Continue Offline (Guest)</button>

    <p class="auth-switch">
      <span id="toSignupText">Don't have an account? <a id="toSignup">Sign up</a></span>
      <span id="toLoginText" class="hidden">Already have an account? <a id="toLogin">Log in</a></span>
    </p>
  </div>
</div>

<!-- ====== PIN LOCK SCREEN ====== -->
<div id="pinScreen" class="screen pin-screen hidden">
  <div class="pin-card">
    <div class="pin-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h2 id="pinTitle">Enter your PIN</h2>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span>
    </div>
    <div id="pinError" class="pin-error hidden">Incorrect PIN, try again</div>
    <div class="pin-keypad" id="pinKeypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="fingerprint" class="pin-ghost"><i class="fa-solid fa-eraser"></i></button>
      <button data-key="0">0</button>
      <button data-key="back"><i class="fa-solid fa-delete-left"></i></button>
    </div>
    <button id="pinLogoutBtn" class="link-btn">Log out instead</button>
  </div>
</div>

<!-- ====== MAIN APP ====== -->
<div id="appScreen" class="screen app-screen hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand"><i class="fa-solid fa-book-bookmark"></i> My Notebook</div>
      <button id="closeSidebarBtn" class="icon-btn only-mobile"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="user-chip" id="userChip">
      <div class="avatar" id="userAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="userName">User</div>
        <div class="user-mode" id="userMode">Offline</div>
      </div>
      <button id="settingsBtn" class="icon-btn"><i class="fa-solid fa-gear"></i></button>
    </div>

    <nav class="nav-list">
      <button class="nav-item active" data-filter="all"><i class="fa-solid fa-note-sticky"></i> All Notes <span class="count" id="countAll">0</span></button>
      <button class="nav-item" data-filter="pinned"><i class="fa-solid fa-thumbtack"></i> Pinned <span class="count" id="countPinned">0</span></button>
      <button class="nav-item" data-filter="trash"><i class="fa-regular fa-trash-can"></i> Trash <span class="count" id="countTrash">0</span></button>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-section-title">
        <span>Notebooks</span>
        <button id="addNotebookBtn" class="icon-btn small"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="notebookList" class="notebook-list"></div>
    </div>

    <div class="sidebar-footer">
      <button id="darkModeBtn" class="nav-item">
        <i class="fa-solid fa-moon" id="darkModeIcon"></i> <span id="darkModeLabel">Dark Mode</span>
      </button>
      <button id="logoutBtn" class="nav-item danger"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main content -->
  <main class="main-content">
    <header class="topbar">
      <button id="openSidebarBtn" class="icon-btn only-mobile"><i class="fa-solid fa-bars"></i></button>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search notes...">
        <button id="clearSearchBtn" class="icon-btn small hidden"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="topbar-title" id="topbarTitle">All Notes</div>
      <div id="syncStatus" class="sync-status" title="Sync status"><i class="fa-solid fa-cloud"></i></div>
    </header>

    <div id="notesGrid" class="notes-grid"></div>

    <div id="emptyState" class="empty-state hidden">
      <i class="fa-regular fa-note-sticky"></i>
      <h3 id="emptyTitle">No notes yet</h3>
      <p id="emptySub">Tap the + button to create your first note.</p>
    </div>

    <button id="newNoteBtn" class="fab"><i class="fa-solid fa-plus"></i></button>
  </main>

  <!-- Note Editor -->
  <div id="editorScreen" class="editor-screen hidden">
    <header class="editor-topbar">
      <button id="editorBackBtn" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
      <select id="editorNotebookSelect" class="notebook-select"></select>
      <div class="editor-actions">
        <button id="editorPinBtn" class="icon-btn" title="Pin"><i class="fa-regular fa-star"></i></button>
        <button id="editorShareBtn" class="icon-btn" title="Share/Export"><i class="fa-solid fa-share-nodes"></i></button>
        <button id="editorDeleteBtn" class="icon-btn" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
      </div>
    </header>
    <input type="text" id="editorTitle" class="editor-title" placeholder="Title">
    <div id="editorMeta" class="editor-meta">Saved</div>
    <div id="editorBody" class="editor-body" contenteditable="true" data-placeholder="Start writing..."></div>
    <input type="file" id="imageInput" accept="image/*" class="hidden">
    <div class="editor-toolbar">
      <button data-cmd="bold"><i class="fa-solid fa-bold"></i></button>
      <button data-cmd="italic"><i class="fa-solid fa-italic"></i></button>
      <button data-cmd="underline"><i class="fa-solid fa-underline"></i></button>
      <button data-cmd="insertUnorderedList"><i class="fa-solid fa-list-ul"></i></button>
      <button data-cmd="insertOrderedList"><i class="fa-solid fa-list-ol"></i></button>
      <button data-cmd="formatBlock" data-value="H2"><i class="fa-solid fa-heading"></i></button>
      <button id="insertImageBtn"><i class="fa-regular fa-image"></i></button>
      <button data-cmd="undo"><i class="fa-solid fa-rotate-left"></i></button>
    </div>
  </div>
</div>

<!-- Generic Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal" id="modalBox"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
